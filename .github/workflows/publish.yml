name: publish

on:
  release:
    types: [created]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # nodejs_22 bundles npm 10, which predates OIDC trusted publishing;
      # run the publish through a modern npm via npx.
      - run: npx -y npm@latest publish --access public
